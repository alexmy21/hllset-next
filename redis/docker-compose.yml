# Podman-compatible compose file for HLLSet Redis stack
# Run: podman-compose -f redis/docker-compose.yml up -d
services:
  redis:
    build:
      context: ..
      dockerfile: redis/Dockerfile
    container_name: hllset-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data:Z
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    userns_mode: keep-id

volumes:
  redis-data:
